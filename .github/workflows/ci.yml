name: Verify Online Tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify
      - run: npm run test:e2e
      - name: Build local launch-mode fixture (no deployment)
        run: npm run build
        env:
          SITE_URL: https://tools.launch-fixture.net
          ALLOW_INDEXING: "true"
          VERCEL_ENV: production
      - name: Verify launch-mode canonicals, schema, and sitemap locally
        run: npm run test:e2e -- tests/e2e/seo.spec.ts
        env:
          TEST_LAUNCH_ORIGIN: https://tools.launch-fixture.net
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
